[package]
name = "cpmx-hid-input"
description = "RED4ext plugin: HID devices (pedals, wheels, sticks) merged into the game's XInput gamepad"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "cpmx_hid_input"
crate-type = ["cdylib"]

[dependencies]
cp2077mm-hidmap = { path = "../hidmap" }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_XboxController",
] }
